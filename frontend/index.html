<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="style.css">
	<title>Card</title>
</head>
<body>
    <div class="Card">
        <div class="header">
            <div class="energy">
                <img src="meta/img/Battery_1.svg" alt="Battery">
            </div>
            <div class="title">
                Title
            </div>
            <div class="tier">
                <div class="tier_text">F-</div>

                <img class="stars" src="meta/img/tier_stars.svg" alt="Stars">
            </div>
        </div>
        <div class="image">
            <div class="image_icon">

            </div>
            <div class="bg">

            </div>
        </div>
        <div class="xp">
            <div class="xp_container">
                <div class="xp_title">
                    <div class="xp_title_label">Опыт</div>
                    <div class="xp_title_divisor"></div>
                    <div class="xp_title_value">1/3</div>
                </div>
                <div class="xp_progress">
                    <div class="xp_bar" id="xp_bar"></div>
                </div>
            </div>
        </div>
        <div class="footer">
            <div class="info_container">
                <div class="tt_container">
                    <div class="tt_icon">
                        <img class="tt_alarm" src="meta/img/alarm.svg" alt="clock">
                    </div>
                    <div class="tt_body">
                        <div class="tt_title">
                            <div class="tt_time">Время</div>
                            <div class="tt_trigger">Триггер</div>
                        </div>
                        <div class="tt_content">
                            <div class="tt_cur_time">16:40</div>
                            <div class="tt_cur_trigger">Lorem, ipsum.</div>
                        </div>
                    </div>
                </div>
                <div class="sb_container">
                    <div class="sb_icon">
                        <img class="sb_buff" src="meta/img/buff_icon.svg" alt="buff">
                    </div>
                    <div class="sb_body">
                        <div class="sb_title">
                            Краткосрочные баффы
                        </div>
                        <div class="sb_content">
                            Lorem ipsum dolor sit amet, consectetur adipisicing.
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
